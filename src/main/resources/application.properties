spring.config.import=optional:file:.env[.properties]
spring.application.name=CveLabhubBack
server.port=${SERVER_PORT}

# =========================
# View
# =========================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# =========================
# DataSource (MySQL)
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# =========================
# JPA
# =========================
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# =========================
# Security
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}

# Service account (Confidential Client)
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.grant-type=${GRANT_TYPE}
keycloak.base-url=${KEYCLOAK_BASE_URL}
keycloak.realm=${KEYCLOAK_REALM}

# =========================
# Logging
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR

# mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# =========================
# AWS S3
# =========================
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.region=${AWS_S3_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.template-path=docs_template/S3_template.docx

# =========================
# CORS 설정
# =========================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

# prometheus
management.server.port=9090
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.enabled=true
management.endpoint.prometheus.require-authorization=false

# =========================
# VM Provisioning
# =========================
# Terraform Server
terraform.server.host=172.16.2.20
terraform.server.port=22
terraform.server.user=root
terraform.server.password=${TERRAFORM_SERVER_PASSWORD}
terraform.server.project-path=/root/vm-provisioning-project/terraform
terraform.server.key-path=/root/vm-provisioning-project/config/vm-provisioning-key

# Guacamole Server
guacamole.server.base-url=http://172.16.4.10:8080/guacamole
guacamole.server.username=guacadmin
guacamole.server.password=guacadmin

# =========================
# Naver News API
# =========================
naver.api.url=https://openapi.naver.com/v1/search/news.json
naver.api.client-id=${NAVER_CLIENT_ID}
naver.api.client-secret=${NAVER_CLIENT_SECRET}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.web=DEBUG