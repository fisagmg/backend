spring.config.import=optional:file:.env[.properties]

# =========================
# ?/?? ??
# =========================
spring.application.name=CveLabhubBack
server.port=${SERVER_PORT}

# =========================
# View (JSP ?? ???)
# =========================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# =========================
# DataSource (MySQL)
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# =========================
# JPA
#   ? ??? ??: ddl-auto=create ? ???? ??? ??? ? ??
#   ?? ?? ? update ?? validate ??
# =========================
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# =========================
# Security (Resource Server - Keycloak JWT ??)
#  - Keycloak Realm? issuer-uri? ??? ??? ??
#  - ??? jwk-set-uri? ?? ??
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
# ??(issuer ?? ?? ? ?? ???? ??)
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://172.16.1.110:9090/realms/dev-realm/protocol/openid-connect/certs

# ??
# Service account (Confidential Client)
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLOAK_SECRET}

# =========================
# Logging (???? INFO ?? ?)
# =========================
logging.level.org.springframework.security=INFO
# InetUtils ????? INFO ?? ???
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR

# =========================
# AWS S3 Configuration
# =========================
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.region=${AWS_S3_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.template-path=docs_template/S3_template.docx

# =========================
# File Upload
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB