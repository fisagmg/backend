spring.config.import=optional:file:.env[.properties]
spring.application.name=CveLabhubBack
server.port=${SERVER_PORT}

# View
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# DataSource (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&autoReconnect=true&socketTimeout=60000&connectTimeout=10000&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000


# project time setting
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JPA
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}

# Service account (Confidential Client)
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.grant-type=${GRANT_TYPE}
keycloak.base-url=${KEYCLOAK_BASE_URL}
keycloak.realm=${KEYCLOAK_REALM}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR

# mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# AWS S3
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.region=${AWS_S3_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.template-path=docs_template/S3_template.docx

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

# prometheus
management.server.port=9090
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.enabled=true
management.endpoint.prometheus.require-authorization=false

# Guacamole Admin / REST
guacamole.base-url=${GUACAMOLE_SERVER_BASE_URL}
#guacamole.iframe-base-url=${GUACAMOLE_IFRAME_BASE_URL}
guacamole.admin-username=${GUACAMOLE_ADMIN_USERNAME}
guacamole.admin-password=${GUACAMOLE_ADMIN_PASSWORD}

# Guacamole DB for permission writes
spring.datasource.guacamole.url=${GUACAMOLE_DB_URL}
spring.datasource.guacamole.username=${GUACAMOLE_DB_USERNAME}
spring.datasource.guacamole.password=${GUACAMOLE_DB_PASSWORD}
spring.datasource.guacamole.driver-class-name=com.mysql.cj.jdbc.Driver

# Runner
terraform.server.url=${TERRAFORM_SERVER_URL}

# Naver News API
naver.api.url=https://openapi.naver.com/v1/search/news.json
naver.api.client-id=${NAVER_CLIENT_ID}
naver.api.client-secret=${NAVER_CLIENT_SECRET}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.web=DEBUG


# max file size(expanded)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# EC2 SSH
ec2.ssh.private-key=${EC2_SSH_PRIVATE_KEY}
ec2.ssh.username=${EC2_SSH_USERNAME:ubuntu}
ec2.ssh.password=${EC2_SSH_PASSWORD:}

# Lab Session Configuration
lab.max-ttl-minutes=120
lab.extend-unit-minutes=30
lab.initial-ttl-minutes=60

# Scheduling
#spring.task.scheduling.enabled=true
