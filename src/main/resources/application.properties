spring.config.import=optional:file:.env[.properties]
spring.application.name=CveLabhubBack
server.port=${SERVER_PORT}

# =========================
# View
# =========================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# =========================
# DataSource (MySQL)
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# =========================
# JPA
# =========================
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# =========================
# Security
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://172.16.1.110:9090/realms/dev-realm/protocol/openid-connect/certs

# Service account (Confidential Client)
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.grant-type=${GRANT_TYPE}
keycloak.base-url=${KEYCLOAK_BASE_URL}
keycloak.realm=${KEYCLOAK_REALM}

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR

# mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8